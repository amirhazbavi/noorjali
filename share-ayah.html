<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراک آیه | تلاوت نور</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080706;color:#f1e8d2;font-family:Tahoma,sans-serif}.card{width:min(92vw,680px);padding:28px;text-align:center;border:1px solid #8a7135;border-radius:18px;background:#171410;box-shadow:0 20px 50px #0009}.ayah{padding:32px 20px;font:2rem/2.2 serif;color:#f0d488;border:1px solid #c9a84c;border-radius:12px}.translation{margin:20px 0;line-height:2}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,a{padding:11px 16px;border-radius:9px;border:1px solid #8a7135;background:transparent;color:#f0d488;text-decoration:none;cursor:pointer;font:inherit}button.primary{background:#c9a84c;color:#161208;border:0}.credit{font-size:.75rem;color:#a89a78}</style></head><body><main class="card"><h1>اشتراک آیه</h1><div id="ayah" class="ayah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div><p id="translation" class="translation">به نام خداوند بخشنده مهربان</p><div class="row"><button class="primary" id="download">دانلود تصویر</button><button id="share">اشتراک‌گذاری</button><a href="./index.html">بازگشت</a></div></main><script>const qs=new URLSearchParams(location.search);const ayah=qs.get('ayah');const translation=qs.get('translation');if(ayah)document.getElementById('ayah').textContent=ayah;if(translation)document.getElementById('translation').textContent=translation;function canvas(){const c=document.createElement('canvas');c.width=1400;c.height=760;const x=c.getContext('2d');x.fillStyle='#080706';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#c9a84c';x.lineWidth=5;x.strokeRect(35,35,c.width-70,c.height-70);x.fillStyle='#f0d488';x.textAlign='center';x.font='52px serif';x.fillText(document.getElementById('ayah').textContent,c.width/2,300);x.fillStyle='#f1e8d2';x.font='30px Tahoma';x.fillText(document.getElementById('translation').textContent,c.width/2,410);x.fillStyle='#a89a78';x.font='22px Tahoma';x.fillText('تلاوت نور',c.width/2,650);return c}download.onclick=()=>{const a=document.createElement('a');a.download='ayah.png';a.href=canvas().toDataURL('image/png');a.click()};share.onclick=async()=>{const text=document.getElementById('ayah').textContent+'\n'+document.getElementById('translation').textContent;if(navigator.share)await navigator.share({title:'آیه‌ای از قرآن',text});else await navigator.clipboard.writeText(text)};</script></body></html>
